<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Hearts Wallet</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #1f081d 0%, #3b0936 50%, #120310 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }
        .hearts-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.4);
            font-size: 20px;
            animation: floatUp 6s infinite linear;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.8); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 182, 193, 0.2);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(255, 105, 180, 0.2);
            z-index: 2;
            position: relative;
        }
        .profile-section { text-align: center; margin-bottom: 20px; }
        .avatar-wrapper {
            position: relative;
            width: 100px; height: 100px;
            margin: 0 auto 12px;
            border-radius: 50%; padding: 4px;
            background: linear-gradient(45deg, #ff69b4, #ff1493, #ffb6c1);
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.6);
        }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #333; }
        .profile-name { font-size: 20px; font-weight: bold; color: #ffb6c1; text-shadow: 0 0 8px rgba(255, 182, 193, 0.5); }
        .account-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,105,180,0.15));
            border: 1px solid rgba(255, 182, 193, 0.4);
            border-radius: 16px; padding: 15px; text-align: center; margin-bottom: 20px;
            position: relative; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .account-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(30deg); animation: shine 4s infinite;
        }
        @keyframes shine { 0% { transform: translateX(-100%) rotate(30deg); } 100% { transform: translateX(100%) rotate(30deg); } }
        .account-label { font-size: 12px; color: #ffb6c1; text-transform: uppercase; letter-spacing: 1px; }
        .account-number { font-size: 22px; font-weight: bold; color: #fff; margin-top: 5px; letter-spacing: 2px; }
        .payment-method-badge { display: inline-block; background: #ff1493; padding: 2px 10px; border-radius: 10px; font-size: 11px; margin-top: 5px; }
        .balance-card {
            background: rgba(0, 0, 0, 0.3); border-radius: 16px; padding: 20px;
            text-align: center; border: 1px solid rgba(255, 105, 180, 0.3); margin-bottom: 20px;
        }
        .balance-amount { font-size: 36px; font-weight: bold; color: #4eff91; text-shadow: 0 0 10px rgba(78, 255, 145, 0.4); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #ffb6c1; }
        .form-control {
            width: 100%; padding: 10px 12px; border-radius: 10px;
            border: 1px solid rgba(255, 182, 193, 0.3); background: rgba(0,0,0,0.4); color: #fff; outline: none;
        }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 12px;
            background: linear-gradient(45deg, #ff1493, #ff69b4); color: #fff; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4); margin-top: 5px;
        }
        .history-section { margin-top: 25px; }
        .history-title { font-size: 14px; color: #ffb6c1; margin-bottom: 10px; border-bottom: 1px solid rgba(255,182,193,0.2); padding-bottom: 5px; }
        .history-item {
            display: flex; justify-content: space-between; background: rgba(255,255,255,0.05);
            padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; font-size: 13px;
        }
        .history-item.add { border-left: 3px solid #4eff91; }
        .history-item.deduct { border-left: 3px solid #ff4e4e; }
        .admin-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 10; justify-content: center; align-items: center;
        }
        .admin-content { background: #250923; border: 1px solid #ff69b4; padding: 25px; border-radius: 20px; width: 90%; max-width: 350px; }
        .footer-report { text-align: center; margin-top: 15px; font-size: 10px; color: rgba(255,255,255,0.3); cursor: pointer; }
    </style>
</head>
<body>
    <div class="hearts-bg" id="heartsBg"></div>
    <div class="container">
        <div class="profile-section">
            <div class="avatar-wrapper">
                <img id="displayAvatar" class="avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Profile">
            </div>
            <div id="displayName" class="profile-name">Moss sathi_Live</div>
        </div>

        <div class="account-card">
            <div class="account-label">Account Details</div>
            <div id="displayAccount" class="account-number">321054258TR</div>
            <span id="displayMethod" class="payment-method-badge">bKash</span>
        </div>

        <div class="balance-card">
            <div style="font-size: 12px; color: #aaa;">Main Balance</div>
            <div class="balance-amount">$<span id="displayBalance">0.50</span></div>
        </div>

        <div class="form-group">
            <label>Change Name</label>
            <input type="text" id="inputName" class="form-control" placeholder="Enter new name">
        </div>
        <div class="form-group">
            <label>Change Profile Picture</label>
            <input type="file" id="inputPic" class="form-control" accept="image/*">
        </div>
        <div class="form-group">
            <label>Payment Method & Account</label>
            <select id="inputMethod" class="form-control" style="margin-bottom: 5px;">
                <option value="bKash">bKash</option>
                <option value="Nagad">Nagad</option>
                <option value="Rocket">Rocket</option>
                <option value="Visa Card">Visa Card</option>
            </select>
            <input type="text" id="inputAccount" class="form-control" placeholder="Account Number">
        </div>
        <button class="btn" onclick="updateProfile()">পরিবর্তন করুন</button>

        <div class="history-section">
            <div class="history-title">Recent Transactions</div>
            <div id="historyList"></div>
        </div>

        <div class="footer-report" onclick="openAdmin()">report</div>
    </div>

    <div class="admin-modal" id="adminModal">
        <div class="admin-content">
            <h3 style="color: #ffb6c1; margin-bottom: 15px; text-align: center;">Admin Panel</h3>
            <div class="form-group">
                <label>Amount ($)</label>
                <input type="number" id="adminAmount" class="form-control" placeholder="e.g. 20">
            </div>
            <div class="form-group">
                <label>Action Type</label>
                <select id="adminAction" class="form-control">
                    <option value="add">Add Balance (+)</option>
                    <option value="deduct">Deduct Balance (-)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Note / Transaction Title</label>
                <input type="text" id="adminNote" class="form-control" placeholder="e.g. $20 payment success">
            </div>
            <button class="btn" onclick="submitAdmin()">Submit</button>
            <button class="btn" style="background: #555; margin-top: 5px;" onclick="closeAdmin()">Close</button>
        </div>
    </div>

    <script>
        const heartsBg = document.getElementById('heartsBg');
        for (let i = 0; i < 15; i++) {
            let heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '♥';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            heartsBg.appendChild(heart);
        }

        // ডিফল্ট ডাটা
        const defaultData = {
            name: "Moss sathi_Live",
            accountNo: "321054258TR",
            paymentMethod: "bKash",
            profilePic: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300",
            balance: 0.50,
            transactions: [
                { id: 1, note: "Received $0.50", amount: 0.50, date: "22 Sep 2026 • 11:30 AM", type: "add" }
            ]
        };

        function getData() {
            const data = localStorage.getItem('wallet_user_data');
            return data ? JSON.parse(data) : defaultData;
        }

        function saveData(data) {
            localStorage.setItem('wallet_user_data', JSON.stringify(data));
        }

        function render() {
            const data = getData();
            document.getElementById('displayName').innerText = data.name;
            document.getElementById('displayAccount').innerText = data.accountNo;
            document.getElementById('displayMethod').innerText = data.paymentMethod;
            document.getElementById('displayBalance').innerText = Number(data.balance).toFixed(2);
            if (data.profilePic) document.getElementById('displayAvatar').src = data.profilePic;

            let historyHtml = '';
            data.transactions.forEach(tx => {
                historyHtml += `
                    <div class="history-item ${tx.type}">
                        <div>${tx.note} <br><small style="color:#aaa;">${tx.date}</small></div>
                        <div style="font-weight:bold; color: ${tx.type === 'add' ? '#4eff91' : '#ff4e4e'}">
                            ${tx.type === 'add' ? '+' : '-'}$${Number(tx.amount).toFixed(2)}
                        </div>
                    </div>
                `;
            });
            document.getElementById('historyList').innerHTML = historyHtml || '<div style="font-size:12px; color:#aaa; text-align:center;">No history</div>';
        }

        function updateProfile() {
            const name = document.getElementById('inputName').value;
            const accountNo = document.getElementById('inputAccount').value;
            const paymentMethod = document.getElementById('inputMethod').value;
            const fileInput = document.getElementById('inputPic');

            let data = getData();
            if (name) data.name = name;
            if (accountNo) data.accountNo = accountNo;
            if (paymentMethod) data.paymentMethod = paymentMethod;

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    data.profilePic = e.target.result;
                    saveData(data);
                    alert('সফলভাবে আপডেট হয়েছে!');
                    render();
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveData(data);
                alert('সফলভাবে আপডেট হয়েছে!');
                render();
            }
        }

        function openAdmin() {
            const code = prompt("Enter Admin Code:");
            if (code === "32105425") {
                document.getElementById('adminModal').style.display = 'flex';
            } else if (code) {
                alert("Wrong Code!");
            }
        }

        function closeAdmin() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function submitAdmin() {
            const amount = parseFloat(document.getElementById('adminAmount').value);
            const action = document.getElementById('adminAction').value;
            const note = document.getElementById('adminNote').value;

            if (isNaN(amount) || amount <= 0) return alert("Amount দিন!");

            let data = getData();
            if (action === 'add') {
                data.balance += amount;
            } else {
                data.balance = Math.max(0, data.balance - amount);
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + 
                            ' • ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            data.transactions.unshift({
                id: Date.now(),
                note: note || (action === 'add' ? 'Payment Success' : 'Deduction Success'),
                amount: amount,
                date: dateStr,
                type: action
            });

            saveData(data);
            alert('ব্যালেন্স আপডেট হয়েছে!');
            closeAdmin();
            render();
        }

        render();
    </script>
</body>
      </html>
